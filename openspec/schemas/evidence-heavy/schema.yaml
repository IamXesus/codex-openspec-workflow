name: evidence-heavy
version: 1
description: Evidence-bound workflow for high-risk changes - proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Concise intent, evidence, scope, and unknowns
    template: proposal.md
    instruction: |
      State why the confirmed change is needed and what observable behavior changes.
      The Why text must contain at least 50 meaningful characters for strict validation.
      Separate inspected facts from observations, hypotheses, and open questions.
      List only capabilities supported by the request or inspected contracts.
      If a material unknown changes behavior, data, security, cost, or an external effect,
      add one unchecked Q-* item and ask the user instead of guessing.
      Record any material decision as a DEC-* block with Status and Source. Repository
      and external evidence can support only a proposed decision; accept it only after explicit
      user approval recorded as user:USER-*.
      Ask only for user-owned behavior or policy choices. Related proposed decisions may be
      shown in one concise decision checkpoint and accepted by one explicit approval that names
      the displayed DEC ids; partial approval leaves the rest proposed.
      Do not invent a capability to satisfy validation. For a pure refactor, tooling, or
      documentation/operations change with no behavior delta, set skip_specs: true in
      .openspec.yaml.
      Preserve `<!-- openspec-architecture-contract:v1 -->` and inspect likely production
      components before choosing exactly one `Architecture impact: none|material`. Use
      `material` when an existing production file is over 1000 lines, expected growth is
      roughly 250 or more production lines in one file, or the change adds multiple
      independently testable responsibilities. This classification does not authorize
      unrelated legacy refactoring.
    requires: []
  - id: specs
    generates: "specs/**/*.md"
    description: Source-backed behavior deltas
    template: spec.md
    instruction: |
      Create one delta spec per confirmed capability. Use OpenSpec ADDED, MODIFIED,
      REMOVED, or RENAMED requirement sections. Each Requirement needs a unique ID: REQ-*, Status, and Source
      metadata, normative SHALL/MUST behavior, and at least one #### Scenario with WHEN/THEN.
      An accepted requirement may cite only exact user authority (user:USER-*) or an
      existing accepted decision (decision:DEC-*). Repository paths and external URLs are
      observational evidence, not authority for new normative behavior. Status is accepted
      only when the cited user evidence semantically entails the entire behavior; otherwise keep the
      uncertainty in proposal.md and stop. Preserve full existing requirement blocks for
      MODIFIED changes. New capabilities need a Purpose of at least 50 meaningful
      characters. A RENAMED section needs accepted Status and Source metadata before its
      FROM/TO pairs.
    requires: [proposal]
  - id: design
    generates: design.md
    description: Technical decisions, risks, rollout, and rollback
    template: design.md
    instruction: |
      Explain only decisions needed to implement accepted requirements. Record each material
      decision as `### DEC-*` with Status and Source; do not create a second id for a decision
      already recorded in proposal. Record context,
      goals and non-goals, decisions with rationale, risks and mitigations, migration and
      rollback only when applicable. Record nonblocking uncertainty as OBS/HYP, never Q-*; every Q-* is blocking. A question that changes requirements,
      architecture, tasks, security, data, cost, or external effects is blocking: ask the
      user instead of selecting a plausible default.
      Preserve `## Component Ownership`. For material architecture impact, replace every
      placeholder with inspected baseline paths/sizes, expected production growth, existing
      and new responsibilities, transaction owner, considered boundary options, one exact
      decision (`keep-cohesive`, `extract-collaborators`, or `temporary-exception`), known
      cost, and a ratchet scope that forbids unrelated legacy refactoring. A missing or pending
      ownership decision means design is not implementation-ready.
    requires: [proposal, specs]
  - id: tasks
    generates: tasks.md
    description: Minimal implementation checklist derived from accepted requirements and design
    template: tasks.md
    instruction: |
      Before writing tasks, resolve the active openspec-workflow skill root and run as a separate fail-closed step:
      `python <openspec-workflow-skill-root>/scripts/validate_change.py --repo <repo> --change <change-name>`.
      Do not substitute native OpenSpec status/validation. A nonzero exit blocks tasks. Then run a
      read-only semantic entailment review. Resolve every blocking Q-* item and proposed material decision.
      Merely finding a cited id, file, line, or URL is not proof that it supports the requirement.
      Derive every task from accepted requirements and recorded design decisions. Preserve contract v3
      and put one `openspec-trace` marker with exact REQ ids and concrete planned verification on each
      implementation checkbox. For explicit `skip_specs: true`, use `requirements=none` while still recording concrete planned verification. The validator prints the read-only requirement-to-decision-to-task-to-verification
      matrix; do not create another artifact.
      Plan one minimum-sufficient evidence set for distinct risks, not one new automated test per
      scenario, task, or file. One concrete check may cover several traced tasks or requirements.
      Prefer reusing an existing check, then extending or parameterizing it, before adding a test
      for a distinct reachable regression. Prefer one stable real vertical slice for a critical
      observable flow when practical; add lower-level or browser/runtime evidence only for a
      separate risk at its cheapest faithful layer. Mock external boundaries rather than the
      consumer's own application, and use a real provider when database semantics are the claim.
      Ordinary work may consolidate overlapping legacy tests only in the touched feature slice
      after replacement evidence passes; whole-suite consolidation requires a separate explicit
      request. Do not add a verification artifact, numeric quota, or mandatory mutation gate.
      For work that creates or materially moves a production type, derive a placement task or
      verification that inspects neighboring feature structure, namespaces or module boundaries,
      dependency registration, and relevant architecture tests. Plan placement by feature and
      cohesive responsibility; do not require generic Interfaces/Implementations buckets solely
      by declaration type or incidental legacy reorganization. A material ownership restructure
      belongs in accepted evidence-heavy scope with architecture review. Concrete examples remain
      authoritative in the consumer repository. Group tasks
      under a small number of semantic implementation waves, not arbitrary task counts. Mark every
      wave heading with a unique `<!-- openspec-wave:<id> -->`. End each wave with targeted
      verification. Add at most one intermediate `openspec-review:wave` checkbox as the last task
      only when inspected material risk or downstream work depends on the changed contract; state
      the concrete trigger and do not add a reviewer merely because a wave, task group, file, or
      checkbox exists. Include one final full-diff release
      review checkbox after the last wave. Use numbered headings and `- [ ] X.Y` checkboxes.
      Every task-like numbered N.M line must be a checkbox; do not hide roadmap, planning,
      or implementation work as plain text outside the task runner. Keep this change to one coherent
      capability/delivery stream; independently accepted or released scope belongs in another change.
      Preserve the review-contract and wave markers from the template, including
      `<!-- openspec-review-contract:v3 -->`, and choose exactly one `UI contract: none|material`.
      For material UI add one checkbox beginning `UI review:` after its UI implementation/verification
      and before final review; complete it only with concrete Artifact, Theme, Viewports, States, Data,
      Evidence, Comparison, Discrepancies, and Reviewer fields after rendered side-by-side inspection.
      When deterministic same-environment browser rendering is available, include a committed Playwright
      toHaveScreenshot baseline; it complements artifact comparison. If rendering cannot be stabilized,
      do not force a flaky baseline and record the limitation.
      A completed final checkpoint must record concrete Coverage, Requirements, Exclusions, and Reviewer
      fields; this attests coverage, while actual freshness after later diffs remains enforced by the
      session/reviewer gate. Include validation and rollback tasks only where the accepted risk requires
      them. Do not add adjacent work.
      For material architecture impact, add exactly one incomplete pre-implementation
      `openspec-review:architecture` checkbox before affected production tasks. Complete it
      only after an independent `$architecture-review` records Coverage, Growth, Ownership,
      Findings, Exclusions, Reviewer, and `Verdict: READY`. Then run
      `python <architecture-review-skill-root>/scripts/validate_openspec_architecture.py --repo <repo> --change <change-name> --phase apply`;
      a nonzero exit blocks completion of the tasks artifact and all implementation.
    requires: [specs, design]
apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Before any implementation, resolve the active openspec-workflow skill root and run as a separate fail-closed step:
    `python <openspec-workflow-skill-root>/scripts/validate_change.py --repo <repo> --change <change-name>`.
    Do not substitute native status/validation; any artifact edit makes an earlier pass stale.
    A nonzero exit remains fail-closed: diagnose and correct unambiguous in-scope agent-authored
    artifacts, rerun the gate, and pause only when correction needs user authority or a material
    decision, or cannot be safely resolved. In a fresh session first reselect this change, reject v1/v2 expansion,
    fetch upstream read-only, and record branch/HEAD/upstream, upstream HEAD, dirty baseline, and
    divergence. Reconcile referenced old commits as evidence/artifacts, never an automatic
    implementation base. After a pass, implement the planned minimum-sufficient evidence set
    without adding a test merely because a task or scenario exists. Reuse, extend, or parameterize
    suitable checks first; one concrete check may cover several traced tasks when it proves their
    combined result. Use a stable real vertical slice as primary acceptance evidence when practical,
    and add focused unit, real-provider integration, contract, browser, or runtime checks only for
    distinct risks at their faithful layer. Keep mocks at external boundaries. Consolidate legacy
    tests only inside the touched feature slice after replacement evidence passes; repository-wide
    consolidation requires separate explicit scope. Treat the full suite as a final regression gate,
    not a test-count target. Then,
    before creating or materially moving a production type, inspect neighboring feature structure,
    namespaces or module boundaries, dependency registration, and relevant architecture tests.
    Place code by feature and cohesive responsibility; use responsibility-named subfolders only
    when they materially improve navigation, never generic Interfaces/Implementations buckets
    solely by declaration type. Do not reorganize adjacent legacy code incidentally. A material
    ownership, namespace, or registration restructure requires accepted evidence-heavy scope and
    architecture review; consumer-specific examples remain local authority. Then implement one
    semantic wave at a time and capture layer-appropriate evidence. Run targeted checks for every
    wave. Dispatch an intermediate independent read-only reviewer only at a planned material-risk
    or dependency checkpoint, after its covered tasks are complete, required deterministic checks
    including CI have finished, and the changed-file inventory is stable. A pre-CI, per-file, or
    wave-existence review cannot satisfy the checkpoint. Continue after a passing review. A validated
    High finding blocks the next dependent work; resolve a validated Medium finding or obtain explicit
    user disposition. Consolidate related fixes and, when practical, return them through one targeted
    continuation with the existing reviewer. Classify later deltas against reviewed coverage: behavior,
    public-contract, auth/security, persistent-data, transaction, external-effect, migration/rollback,
    or adjacent reviewed-contract changes stale affected coverage; a mechanical or evidence-only delta
    with sufficient deterministic proof does not automatically stale unaffected coverage. Repeat a full
    review only for material cross-wave or overall-risk expansion. Authorized non-production test or
    staging deployment used to obtain evidence still requires explicit authority, rollback, bounded scope,
    and risk-proportionate preflight, but does not require the final release review merely because it is a
    deploy. Run the final full-diff review after required test/staging evidence and before production release
    or deployment; the last intermediate review may satisfy it only if the reviewer declared full pending-diff
    coverage, checked requirements and exclusions, and no later material delta affected that coverage.
    Reopen affected tasks and add a remediation
    wave after validated findings. Reconcile unambiguous in-scope drift automatically; pause on a new
    unknown only when it requires a user-owned decision. External effects still require their separate authority and GO gate.
    Before any production edit, run `$architecture-review` against the inspected baseline and
    planning artifacts, then run
    `python <architecture-review-skill-root>/scripts/validate_openspec_architecture.py --repo <repo> --change <change-name> --phase apply`.
    A nonzero exit or `NOT READY` verdict blocks implementation even when native OpenSpec state
    says ready. Existing large services are grandfathered only as baseline: do not start broad
    cleanup, but do not add an unowned responsibility or exceed the accepted growth decision.
