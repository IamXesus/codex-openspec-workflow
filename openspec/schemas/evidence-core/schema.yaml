name: evidence-core
version: 1
description: Evidence-bound workflow for medium changes - proposal → specs → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Concise intent, evidence, scope, and unknowns
    template: proposal.md
    instruction: |
      State why the confirmed change is needed and what observable behavior changes.
      The Why text must contain at least 50 meaningful characters for strict validation.
      Separate inspected facts from observations, hypotheses, and open questions.
      List only capabilities supported by the request or inspected contracts.
      If a material unknown changes behavior, data, security, cost, or an external effect,
      add one unchecked Q-* item and ask the user instead of guessing.
      Record any material decision as a DEC-* block with Status and Source. Repository
      and external evidence can support only a proposed decision; accept it only after explicit
      user approval recorded as user:USER-*.
      Ask only for user-owned behavior or policy choices. Related proposed decisions may be
      shown in one concise decision checkpoint and accepted by one explicit approval that names
      the displayed DEC ids; partial approval leaves the rest proposed.
      Do not invent a capability to satisfy validation. For a pure refactor, tooling, or
      documentation change, set skip_specs: true in .openspec.yaml.
      Preserve `<!-- openspec-architecture-contract:v1 -->` and inspect likely production
      components before choosing exactly one `Architecture impact: none|material`. Material
      means an existing production file over 1000 lines, expected growth of roughly 250 or
      more production lines in one file, or multiple independently testable responsibilities.
      `material` is incompatible with evidence-core: stop before specs/tasks and recreate the
      change with evidence-heavy so design and component ownership can be reviewed.
    requires: []
  - id: specs
    generates: "specs/**/*.md"
    description: Source-backed behavior deltas
    template: spec.md
    instruction: |
      Create one delta spec per confirmed capability. Use OpenSpec ADDED, MODIFIED,
      REMOVED, or RENAMED requirement sections. Each Requirement needs a unique ID: REQ-*, Status, and Source
      metadata, normative SHALL/MUST behavior, and at least one #### Scenario with WHEN/THEN.
      An accepted requirement may cite only exact user authority (user:USER-*) or an
      existing accepted decision (decision:DEC-*). Repository paths and external URLs are
      observational evidence, not authority for new normative behavior. Status is accepted
      only when the cited user evidence semantically entails the entire behavior; otherwise keep the
      uncertainty in proposal.md and stop before tasks. Preserve full existing requirement
      blocks for MODIFIED changes. New capabilities need a Purpose of at least 50 meaningful
      characters. A RENAMED section needs accepted Status and Source metadata before its
      FROM/TO pairs.
    requires: [proposal]
  - id: tasks
    generates: tasks.md
    description: Minimal implementation checklist derived from accepted requirements
    template: tasks.md
    instruction: |
      Before writing tasks, resolve the active openspec-workflow skill root and run as a separate fail-closed step:
      `python <openspec-workflow-skill-root>/scripts/validate_change.py --repo <repo> --change <change-name>`.
      Do not substitute native OpenSpec status/validation. A nonzero exit blocks tasks. Then run a
      read-only semantic entailment review. Resolve every blocking Q-* item and proposed material decision.
      Merely finding a cited id, file, line, or URL is not proof that it supports the requirement.
      Derive every task from accepted requirements. Preserve contract v3 and put one
      `openspec-trace` marker with exact REQ ids and concrete planned verification on each
      implementation checkbox. For explicit `skip_specs: true`, use `requirements=none` while still recording concrete planned verification. The validator prints the read-only requirement-to-decision-to-task-to-verification
      matrix; do not create another artifact.
      Plan one minimum-sufficient evidence set for distinct risks, not one new automated test per
      scenario, task, or file. One concrete check may cover several traced tasks or requirements.
      Prefer reusing an existing check, then extending or parameterizing it, before adding a test
      for a distinct reachable regression. Prefer one stable real vertical slice for a critical
      observable flow when practical; add lower-level or browser/runtime evidence only for a
      separate risk at its cheapest faithful layer. Mock external boundaries rather than the
      consumer's own application, and use a real provider when database semantics are the claim.
      Ordinary work may consolidate overlapping legacy tests only in the touched feature slice
      after replacement evidence passes; whole-suite consolidation requires a separate explicit
      request. Do not add a verification artifact, numeric quota, or mandatory mutation gate.
      For work that creates or materially moves a production type, derive a placement task or
      verification that inspects neighboring feature structure, namespaces or module boundaries,
      dependency registration, and relevant architecture tests. Plan placement by feature and
      cohesive responsibility; do not require generic Interfaces/Implementations buckets solely
      by declaration type or incidental legacy reorganization. A material ownership restructure
      belongs in accepted evidence-heavy scope with architecture review. Concrete examples remain
      authoritative in the consumer repository. Use numbered headings and `- [ ] X.Y`
      checkboxes. Every task-like numbered N.M line must be a checkbox; do not hide roadmap,
      planning, or implementation work as plain text outside the task runner. End the bounded change with one independent read-only review checkpoint after
      implementation and targeted verification. Preserve the review-contract markers from the
      template. Preserve `<!-- openspec-review-contract:v3 -->` and choose exactly one `UI contract: none|material`.
      For material UI add one checkbox beginning `UI review:` before final review; complete it only
      with concrete Artifact, Theme, Viewports, States, Data, Evidence, Comparison, Discrepancies,
      and Reviewer fields after rendered side-by-side inspection. A completed final checkpoint must record concrete Coverage, Requirements,
      When deterministic same-environment browser rendering is available, include a committed Playwright
      toHaveScreenshot baseline; it complements artifact comparison. If rendering cannot be stabilized,
      do not force a flaky baseline and record the limitation.
      Exclusions, and Reviewer fields; actual freshness after later diffs remains enforced by the
      session/reviewer gate. Keep tasks small, ordered, and verifiable. Do not
      add adjacent work.
      Run `$architecture-review` and
      `python <architecture-review-skill-root>/scripts/validate_openspec_architecture.py --repo <repo> --change <change-name> --phase apply`
      before completing tasks. A material impact or nonzero exit means the evidence-core change
      is not implementation-ready and must move to evidence-heavy.
    requires: [specs]
apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Before any implementation, resolve the active openspec-workflow skill root and run as a separate fail-closed step:
    `python <openspec-workflow-skill-root>/scripts/validate_change.py --repo <repo> --change <change-name>`.
    Do not substitute native status/validation; any artifact edit makes an earlier pass stale.
    A nonzero exit remains fail-closed: diagnose and correct unambiguous in-scope agent-authored
    artifacts, rerun the gate, and pause only when correction needs user authority or a material
    decision, or cannot be safely resolved. In a fresh session first reselect this change, reject any expansion of
    a v1/v2 compatibility change, confirm the request still matches its accepted capability and
    existing open tasks, fetch upstream read-only, and record current HEAD,
    upstream HEAD, dirty state, and divergence. Reconcile referenced old commits as evidence/artifacts,
    never an automatic implementation base. Then implement only accepted requirements and
    record branch/HEAD/upstream and the dirty baseline before editing. Mark tasks complete only as
    layer-appropriate evidence is produced. Implement the planned minimum-sufficient evidence set
    without adding a test merely because a task or scenario exists. Reuse, extend, or parameterize
    suitable checks first; one concrete check may cover several traced tasks when it proves their
    combined result. Use a stable real vertical slice as primary acceptance evidence when practical,
    and add focused unit, real-provider integration, contract, browser, or runtime checks only for
    distinct risks at their faithful layer. Keep mocks at external boundaries. Consolidate legacy
    tests only inside the touched feature slice after replacement evidence passes; repository-wide
    consolidation requires separate explicit scope. Treat the full suite as a final regression gate,
    not a test-count target. Before creating or materially moving a production type,
    inspect neighboring feature structure,
    namespaces or module boundaries, dependency registration, and relevant architecture tests.
    Place code by feature and cohesive responsibility; use responsibility-named subfolders only
    when they materially improve navigation, never generic Interfaces/Implementations buckets
    solely by declaration type. Do not reorganize adjacent legacy code incidentally. A material
    ownership, namespace, or registration restructure requires accepted evidence-heavy scope and
    architecture review; consumer-specific examples remain local authority. After targeted
    verification, dispatch and await one independent read-only review before marking the change complete or
    handing it off; continue automatically after it passes, resolve blocking findings, and re-review affected
    contracts after fixes. If no independent reviewer is available, report the gate as not run and
    do not complete or hand off the change without explicit user disposition. A reviewer must declare
    full or partial coverage, checked requirements, and exclusions; partial coverage cannot close the
    final checkpoint. Reopen affected tasks after a validated finding. Reconcile unambiguous in-scope
    drift automatically; pause on a new unknown only when it requires a user-owned decision.
    Before any production edit, run
    `python <architecture-review-skill-root>/scripts/validate_openspec_architecture.py --repo <repo> --change <change-name> --phase apply`.
    A nonzero exit blocks implementation even when native OpenSpec state says ready. Material
    architecture impact is incompatible with evidence-core and must move to evidence-heavy.
